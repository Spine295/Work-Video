<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 Player Template</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:900px;
    background:#1e1e1e;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

header{
    background:#222;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.video-container{
    background:black;
}

video{
    width:100%;
    display:block;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    padding:20px;
    flex-wrap:wrap;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#0078ff;
    color:white;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

button:hover{
    background:#005dcc;
}

input[type=range]{
    width:180px;
}

footer{
    text-align:center;
    padding:15px;
    background:#222;
    color:#aaa;
}
</style>
</head>
<body>

<div class="container">

<header>
MP4 Video Player
</header>

<div class="video-container">
    <video id="player">
        <source src="Job Compilation-360p30 2.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>
</div>

<div class="controls">
    <button onclick="playVideo()">▶ Play</button>
    <button onclick="pauseVideo()">⏸ Pause</button>
    <button onclick="restartVideo()">⏮ Restart</button>

    <label>
        Volume
        <input type="range" min="0" max="1" step="0.01" value="1" id="volume">
    </label>

    <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>

<footer>
HTML5 MP4 Player Template
</footer>

</div>

<script>
const video = document.getElementById("player");
const volume = document.getElementById("volume");

function playVideo(){
    video.play();
}

function pauseVideo(){
    video.pause();
}

function restartVideo(){
    video.currentTime = 0;
    video.play();
}

volume.addEventListener("input", function(){
    video.volume = this.value;
});

function toggleFullscreen(){
    if(video.requestFullscreen){
        video.requestFullscreen();
    }else if(video.webkitRequestFullscreen){
        video.webkitRequestFullscreen();
    }else if(video.msRequestFullscreen){
        video.msRequestFullscreen();
    }
}
</script>

</body>
</html>
